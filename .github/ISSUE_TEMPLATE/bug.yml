name: Bug report
description: Report a problem with the plugin
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill out the fields below; the more context you give, the faster we can reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, commands, or prompts that trigger the bug.
      placeholder: |
        1. Install the plugin from ...
        2. Run /skill-pulse
        3. ...
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: opencode version
      description: Output of `opencode --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any error output or log lines related to the issue.