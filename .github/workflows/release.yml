name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, without the 'v' prefix (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop
      - name: Validate version
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check package.json version matches
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          PKG_VERSION="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version ($VERSION)"
            exit 1
          fi
      - name: Check tag does not exist
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi
          echo "Tag v$VERSION is available"
      - name: Merge develop into main via a release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          git fetch origin main develop
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/develop)" ]; then
            echo "develop and main already point to the same commit"
          else
            RELEASE_BRANCH="release/v$VERSION"
            git push origin "origin/develop:refs/heads/$RELEASE_BRANCH"
            PR_URL="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
            if [ -z "$PR_URL" ]; then
              PR_URL="$(gh pr create \
                --base main \
                --head "$RELEASE_BRANCH" \
                --title "chore: release v$VERSION" \
                --body "Run by the Release workflow for v$VERSION.")"
            fi
            echo "Waiting for checks on $PR_URL"
            gh pr checks "$PR_URL" --watch --interval 15
            echo "Merging $PR_URL"
            gh pr merge "$PR_URL" --rebase --delete-branch=true
            git fetch origin main develop
          fi
          if [ "$(git rev-parse 'origin/main^{tree}')" != "$(git rev-parse 'origin/develop^{tree}')" ]; then
            echo "ERROR: origin/main has not caught up with origin/develop; refusing to tag a broken release"
            exit 1
          fi
      - name: Create tag
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" "origin/main"
          git push origin "v$VERSION"
      - name: Publish release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"