name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, without the 'v' prefix (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check tag does not exist
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi
          echo "Tag v$VERSION is available"
      - name: Create tag
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Publish release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"